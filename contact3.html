        <a href="contact.html" class="btn-contact">contact</a>

   <main class="contact">
  <!-- Colonne gauche : titre + téléphone -->
  <div class="contact-gauche">
    <h1 class="contact-titre">On prend<br>rendez-vous ?</h1>

    <button class="telephone" aria-label="Découvrir la suite du message">
      <img src="images/telephone.png" alt="">
    </button>
  </div>

  <!-- Colonne droite : message + formulaire -->
  <div class="contact-droite">
    <p class="contact-texte">
      Un premier échange téléphonique gratuit nous permettra de faire connaissance.
    </p>

    <form class="formulaire" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="NOTRE_ACCESS_KEY">
      <input type="hidden" name="subject" value="Nouveau message depuis le site Take Five">

      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" autocomplete="family-name" required>

      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" name="prenom" autocomplete="given-name" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit" class="btn-contact btn-envoyer">Envoyer</button>
    </form>
  </div>
</main>

<!-- La suite du message, au clic sur le téléphone -->
<dialog id="modale-message" class="modale modale--message">
  <button class="modale-fermer" aria-label="Fermer">×</button>
  <div class="modale-texte">
    <p class="modale-message">
      Un premier échange téléphonique gratuit nous permettra de faire connaissance.
    </p>
    <!-- la suite du texte d'Alexandra viendra ici -->
  </div>
</dialog>

<div class="toast" role="status" aria-live="polite"></div>
